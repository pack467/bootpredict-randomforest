<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Football Boots Classifier{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/components.css" rel="stylesheet">
    <link href="/static/css/catalog.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="bg-pattern"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-icon">⚽</span> Boots<span class="text-primary-custom">Classifier</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button type="button" class="theme-toggle-btn d-lg-none" id="theme-toggle-mobile" aria-label="Toggle Theme">
                    <i class="bi bi-moon-stars-fill theme-icon" id="theme-icon-mobile"></i>
                </button>
                <button class="navbar-toggler border-0 shadow-none px-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <i class="bi bi-list fs-2"></i>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard"><i class="bi bi-house"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history"><i class="bi bi-clock-history"></i> Riwayat</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/catalog"><i class="bi bi-shop"></i> Katalog</a>
                    </li>
                    <!-- Admin Link (Handled via JS if token exists) -->
                    <li class="nav-item d-none" id="nav-admin-link">
                        <a class="nav-link" href="/admin"><i class="bi bi-shield-lock"></i> Admin</a>
                    </li>
                </ul>
                <div class="d-none d-lg-flex align-items-center gap-3">
                    <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
                        <i class="bi bi-moon-stars-fill theme-icon" id="theme-icon"></i>
                    </button>
                    <!-- Auth Buttons -->
                    <div id="auth-buttons-container">
                        <a href="/login" class="btn btn-secondary-custom btn-sm py-1 px-3" id="btn-nav-login">Masuk</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-wrapper">
        {% block content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            const user = getUser();
            
            if (token && user) {
                // User is logged in
                const authContainer = document.getElementById('auth-buttons-container');
                if (authContainer) {
                    authContainer.innerHTML = `
                        <div class="dropdown">
                            <button class="btn btn-secondary-custom btn-sm py-1 px-3 dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> ${user.username}
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-light">
                                <li><a class="dropdown-item" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</a></li>
                            </ul>
                        </div>
                    `;
                }
                
                if (user.role === 'admin') {
                    const adminLink = document.getElementById('nav-admin-link');
                    if (adminLink) adminLink.classList.remove('d-none');
                }
            }
            
            // Mobile theme toggle
            const mToggle = document.getElementById('theme-toggle-mobile');
            const mIcon = document.getElementById('theme-icon-mobile');
            if(mToggle && mIcon) {
                mToggle.addEventListener('click', () => {
                    ThemeManager.toggleTheme();
                    if(ThemeManager.currentTheme === 'dark') {
                        mIcon.className = 'bi bi-moon-stars-fill theme-icon';
                        mIcon.style.transform = 'rotate(360deg)';
                    } else {
                        mIcon.className = 'bi bi-sun-fill theme-icon';
                        mIcon.style.transform = 'rotate(0deg)';
                    }
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
