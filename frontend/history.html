<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Riwayat Prediksi - Sistem Rekomendasi Sepatu Bola">
    <title>Riwayat - Football Boots Classifier</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/components.css" rel="stylesheet">
</head>
<body>
    <div class="bg-pattern"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/dashboard.html">
                <span class="brand-icon">⚽</span> Boots<span class="text-primary-custom">Classifier</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button type="button" class="theme-toggle-btn d-lg-none" id="theme-toggle-mobile" aria-label="Toggle Theme">
                    <i class="bi bi-moon-stars-fill theme-icon" id="theme-icon-mobile"></i>
                </button>
                <button class="navbar-toggler border-0 shadow-none px-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <i class="bi bi-list fs-2"></i>
                </button>
            </div>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto align-items-center gap-1">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html"><i class="bi bi-house"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/history.html"><i class="bi bi-clock-history"></i> Riwayat</a>
                    </li>
                    <li class="nav-item" id="admin-link" style="display:none;">
                        <a class="nav-link" href="/admin.html"><i class="bi bi-shield-lock"></i> Admin</a>
                    </li>
                </ul>
                <div class="d-none d-lg-flex align-items-center gap-3">
                    <button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Theme">
                        <i class="bi bi-moon-stars-fill theme-icon" id="theme-icon"></i>
                    </button>
                    <button class="btn btn-secondary-custom btn-sm py-1 px-3" onclick="logout()">
                        <i class="bi bi-box-arrow-right me-1"></i> Keluar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="page-wrapper">
        <div class="page-container container">
            
            <!-- Page Header -->
            <div class="hero-greeting mb-4 animate-fade-up" style="padding: 2rem 2.5rem;">
                <div class="row align-items-center" style="position: relative; z-index: 2;">
                    <div class="col">
                        <h1 class="fw-800 mb-1"><i class="bi bi-clock-history me-2"></i>Riwayat Prediksi</h1>
                        <p class="mb-0 opacity-85">Lihat semua prediksi dan klasifikasi yang telah Anda lakukan sebelumnya.</p>
                    </div>
                </div>
            </div>

            <div class="glass-card p-0 overflow-hidden animate-fade-up delay-100">
                <div id="history-container">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary-custom" role="status"></div>
                        <div class="mt-3 text-muted-custom">Memuat riwayat...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/config.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/history.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getUser();
            const adminLink = document.getElementById('admin-link');
            if (adminLink && user && user.role === 'admin') adminLink.style.display = 'block';

            const mToggle = document.getElementById('theme-toggle-mobile');
            const mIcon = document.getElementById('theme-icon-mobile');
            if(mToggle && mIcon) {
                mToggle.addEventListener('click', () => {
                    ThemeManager.toggleTheme();
                    if(ThemeManager.currentTheme === 'dark') {
                        mIcon.className = 'bi bi-moon-stars-fill theme-icon';
                        mIcon.style.transform = 'rotate(360deg)';
                    } else {
                        mIcon.className = 'bi bi-sun-fill theme-icon';
                        mIcon.style.transform = 'rotate(0deg)';
                    }
                });
            }
        });
        initHistory();
    </script>
</body>
</html>
